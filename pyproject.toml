[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "deepeval>=0.21.28",
    "docling>=2.143.1",
    "easyocr>=1.7.2",
    "fonttools>=4.68.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.18",
    "langgraph-checkpoint>=4.3.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "loguru>=0.7.3",
    "ollama>=0.6.3",
    "onnxruntime>=1.26.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.0",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rich>=15.0.0",
    "sentence-transformers>=3.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.70.1",
    "unstructured>=0.27.35",
    "xlrd>=2.0.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

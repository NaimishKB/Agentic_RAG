[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "deepeval>=3.0.0",
    "docling>=2.143.1",
    "easyocr>=1.7.2",
    "fastapi>=0.162.0",
    "fonttools>=4.68.0",
    "google-generativeai>=0.8.6",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langgraph>=1.2.18",
    "langgraph-checkpoint>=4.3.1",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "loguru>=0.7.3",
    "ollama>=0.6.3",
    "onnxruntime>=1.26.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.0",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "pypdf>=6.21.3",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "rich>=13.6.0",
    "ruff>=0.17.3",
    "sentence-transformers>=3.0",
    "streamlit>=1.66.1",
    "tenacity>=8.4.1",
    "tiktoken>=0.14.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "torchvision>=0.21.0",
    "tqdm>=4.70.1",
    "unstructured>=0.27.35",
    "uvicorn>=0.54.0",
    "xlrd>=2.0.2",
]

[project.scripts]
server = "src.api.app:main"
ui = "ui.runner:main"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
